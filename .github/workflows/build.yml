name: CI

# 作りは browserhive-specs と同じ。公開は GitHub Pages が main を直接配る（Deploy from a branch、
# main の根）。この workflow は公開の経路に居ないので、する仕事は検査だけ。壊れた原稿の merge を
# 止められるのはここだけなので、build は blocking にしてある。
#
# ReSpec は閲覧者のブラウザで走る。w3.org からは読まず、repo に同梱した assets/js/respec-w3c.js を
# 相対パスで読む。同じオリジンのファイルが引けなくなるのは「無い」か「パスが違う」ときだけで、それは
# assets の job がブラウザ無しで見ている。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # 書き込み権限は要らない。この job はどこへも push しない。
    strategy:
      matrix:
        doc:
          # 版を足したらここにも足す。焼かれない版は、壊れていても気づけない。
          - 1.0.0
          - 1.0.0/ja
          - 1.1.0
          - 1.1.0/ja
          - 1.2.0
          - 1.2.0/ja
          - 1.3.0
          - 1.3.0/ja
    steps:
      - uses: actions/checkout@v4

      # 2 回試す。ReSpec のビルドは 20 秒の総予算で走り、runner が混んでブラウザの起動が予算を
      # 食い尽くすと、原稿が正しくても落ちる（browserhive-specs で実測: 起動 19.648 秒 → 残り 352 ms）。
      # 予算は spec-prod が `-t 20` と決め打ちしていて、入力からは触れない。flake は 2 回目でたいてい
      # 通り、壊れた原稿は何回でも同じ場所で落ちるので、赤は本物のエラーだけになる。
      - uses: w3c/spec-prod@v2
        id: try1
        continue-on-error: true
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.doc }}/index.html
          DESTINATION: ${{ matrix.doc }}/index.html
          VALIDATE_MARKUP: true
          VALIDATE_LINKS: false
          ARTIFACT_NAME: built-${{ strategy.job-index }}

      # continue-on-error を付けるのは 1 回目だけ。job 全体は blocking のままにする。
      - uses: w3c/spec-prod@v2
        if: steps.try1.outcome == 'failure'
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.doc }}/index.html
          DESTINATION: ${{ matrix.doc }}/index.html
          # markup 検査（W3C nu validator）は既定で true。依存しているので明記する。
          VALIDATE_MARKUP: true
          # spec-prod のリンク検査は使えない。link-checker 1.4.2 が superagent 3.8.3 に依存していて、
          # リダイレクトを踏むとツール自体が TypeError で落ちる。ReSpec は github: の設定から
          # .../issues/new/choose を作り、未ログインだと 302 でログイン画面へ飛ぶので、何もしなくても
          # 必ず踏む。代わりに下の linkcheck の job が、リダイレクトを追って最終状態を見る。
          VALIDATE_LINKS: false
          ARTIFACT_NAME: built-${{ strategy.job-index }}

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 各原稿から同梱 ReSpec が解決すること
        run: |
          # 閲覧者のブラウザで描く以上、script が引けなければページは崩れる。崩れても HTTP は 200
          # なので、公開の後に気づく手立てが無い。同じオリジンに置いてあるので、壊れ方は「ファイルが
          # 無い」か「パスが違う」の 2 つしかなく、どちらもブラウザを起こさずに確かめられる。
          FAIL=0
          for doc in 1.0.0/index.html 1.0.0/ja/index.html \
                     1.1.0/index.html 1.1.0/ja/index.html \
                     1.2.0/index.html 1.2.0/ja/index.html \
                     1.3.0/index.html 1.3.0/ja/index.html \
                     latest/index.html latest/ja/index.html; do
            src=$(grep -o 'src="[^"]*respec[^"]*"' "$doc" | sed 's/src="//; s/"$//')
            if [ -z "$src" ]; then
              echo "::error::$doc が ReSpec を読み込んでいない"
              FAIL=1
              continue
            fi
            target="$(dirname "$doc")/$src"
            if [ -f "$target" ]; then
              echo "  ok   $doc -> $src"
            else
              echo "::error::$doc -> $src が解決しない"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: 最新の版の節が錨を原稿に持つこと
        run: |
          # browserhive の要求の目録は、この仕様の節を錨で指し、その錨が在るかをブラウザを起こさずに
          # 原稿から読む。ReSpec は id の無い section にも描くときに見出しから id を作るが、それは
          # 原稿には現れないので、静的に読む側からは見えない。
          #
          # 見るのは latest/ だけ。新しい版を出すときは latest/ をその版で上書きするので、ここが
          # いつも最新の版になる。
          #
          # Conformance の節だけは id を書かない。ReSpec は section#conformance を特別に扱い、書くと
          # RFC 2119 の定型文が入り、参考文献が Informative から Normative に変わる（browserhive-specs
          # の 1.14.0 で試した）。描画を変えずには書けない。
          FAIL=0
          for doc in latest/index.html latest/ja/index.html; do
            perl -0777 -ne '
              my $bad = 0;
              while (/<section\b(?![^>]*\bid=)[^>]*>\s*(?:<h([2-6])\b[^>]*>(.*?)<\/h\1>)?/gs) {
                my $t = defined $2 ? $2 : "(見出しが無い)";
                $t =~ s/<[^>]+>//g;
                next if $t eq "Conformance";
                print "::error file=${ARGV}::id の無い section: $t\n";
                $bad = 1;
              }
              while (/<h([2-6])\b[^>]*>(.*?)<\/h\1>/gs) {
                my $start = $-[0];
                my $t = $2;
                $t =~ s/<[^>]+>//g;
                next if substr($_, 0, $start) =~ /<section\b[^>]*>\s*\z/;
                print "::error file=${ARGV}::section の最初の子でない見出し: $t\n";
                $bad = 1;
              }
              exit $bad;
            ' "$doc" && echo "  ok   $doc" || FAIL=1
          done
          exit $FAIL

      - name: WARC の例の Content-Length が本文のバイト数と合うこと
        env:
          DOCS: "*/index.html */ja/index.html"
        run: |
          # 例のレコードの Content-Length は人が手で数えて書いた値で、版を写すたびに一緒に写る。
          # browserhive-specs（WACZ Profile）では誤った数が 13 版のあいだ誰にも気づかれずに残った
          # （2026-11-01 に訂正）。application/warc-fields の行の終わりは CRLF なので、本文を CRLF で
          # 数え直して照らす。それ以外の本文（1.1.0 からの写しの HTML）は、producer が書くとおり
          # 行の終わりが LF で最後に改行が無いので、書いたバイト列のまま数える。
          python3 - <<'PY'
          import glob, html, os, re, sys
          docs = sorted({p for g in os.environ["DOCS"].split() for p in glob.glob(g)})
          seen = bad = 0
          for p in docs:
              text = open(p, encoding="utf-8").read()
              for pre in re.findall(r"<pre\b[^>]*>(.*?)</pre>", text, flags=re.S):
                  s = html.unescape(pre).lstrip("\n")
                  if not s.startswith("WARC/1.1"):
                      continue
                  head, sep, body = s.partition("\n\n")
                  m = re.search(r"^Content-Length: (\d+)$", head, flags=re.M)
                  if not sep or m is None:
                      print(f"::error file={p}::WARC の例に Content-Length か、ヘッダの後の空行が無い")
                      bad += 1
                      continue
                  seen += 1
                  lines = body.strip("\n").split("\n")
                  if re.search(r"^Content-Type: application/warc-fields$", head, flags=re.M):
                      actual = 0 if lines == [""] else len(("\r\n".join(lines) + "\r\n").encode("utf-8"))
                  else:
                      actual = len(body.encode("utf-8"))
                  if actual != int(m.group(1)):
                      print(f"::error file={p}::Content-Length {m.group(1)} だが、本文は {actual} バイト（1 行目: {lines[0]}）")
                      bad += 1
          print(f"WARC の例: {seen} 個（{len(docs)} 文書）")
          if seen == 0:
              print("::error::WARC の例を 1 つも見つけられない。何も見ていない緑にしない")
              bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: ja の冒頭の版が置き場の版と合うこと
        env:
          JA_DOCS: "*/ja/index.html"
          TITLE: BrowserHive WARC Profile
        run: |
          # browserhive-specs では、前の版の訳を写して次の版を作ったとき冒頭の版を直し忘れ、5 版に
          # 写り続けた（2026-11-01 に訂正）。latest/ja/ は latest/index.html の title の版と比べる。
          python3 - <<'PY'
          import glob, os, re, sys
          title = os.environ["TITLE"]
          checked = bad = 0
          for p in sorted(glob.glob(os.environ["JA_DOCS"])):
              version_dir = os.path.dirname(os.path.dirname(p))
              version = os.path.basename(version_dir)
              if version == "latest":
                  en = open(os.path.join(version_dir, "index.html"), encoding="utf-8").read()
                  t = re.search(r"<title>" + re.escape(title) + r" ([0-9.]+)</title>", en)
                  want = t.group(1) if t else None
              else:
                  want = version
              m = re.search(r"これは " + re.escape(title) + r" ([0-9.]+) の日本語訳です", open(p, encoding="utf-8").read())
              checked += 1
              if m is None or want is None:
                  print(f"::error file={p}::冒頭の「これは {title} N の日本語訳です」か、比べる版が見つからない")
                  bad += 1
              elif m.group(1) != want:
                  print(f"::error file={p}::冒頭は {m.group(1)} の日本語訳と書くが、置き場の版は {want}")
                  bad += 1
          print(f"ja の冒頭: {checked} 本")
          if checked == 0:
              print("::error::ja の原稿を 1 本も見つけられない。何も見ていない緑にしない")
              bad += 1
          sys.exit(1 if bad else 0)
          PY

  linkcheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # merge しない。どの artifact も index.html という名前なので、混ぜると片方が上書きされて
          # 検査されないまま緑になる。
          pattern: built-*
          path: built
      - name: Every link in the built document resolves
        run: |
          # 外部リンクの検査は、一過性の失敗と本物の切れを見分けないと使いものにならない
          # （browserhive-specs は初回で 429 と 503 を踏み、どちらも数十秒後には 200 を返した）。
          #
          # 判定:
          #   200            通す
          #   429 / 5xx / 0  間を置いて再試行。最後まで駄目なら落とす
          #   その他 4xx     即座に落とす（本物の切れ。iso.org はこの User-Agent に 403 を返すので、
          #                  原稿から href で指さない）
          check() {
            local url=$1 code
            for attempt in 1 2 3; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' \
                     -A 'Mozilla/5.0 (compatible; browserhive-warc-spec linkcheck)' \
                     --max-time 30 "$url" || echo 000)
              case "$code" in
                200) echo "  200 $url"; return 0 ;;
                429|5??|000) sleep $((attempt * 10)) ;;
                *) echo "::error::$url -> $code"; return 1 ;;
              esac
            done
            echo "::error::$url -> $code (3 回試して駄目)"
            return 1
          }

          # 検査するのは「著者が書いたリンク」だけ。ReSpec が github: の設定から作るリンク
          # （repo・commits・issues・pulls）と、この repo の github.io は構成から決まるので外す
          # （GitHub は runner からの未認証の読みを強く絞り、github.io は最初の公開までは 404）。
          OWNER=${GITHUB_REPOSITORY%%/*}
          SKIP="^https://(github\.com/${GITHUB_REPOSITORY}|${OWNER}\.github\.io/${GITHUB_REPOSITORY#*/})"

          FAIL=0
          # 落としたすべての文書を対象にする。1 本も見つけられないまま緑にならないよう、件数を
          # 確かめてから回る。
          DOCS=$(find built -name '*.html' | sort)
          test -n "$DOCS" || { echo "::error::検査対象の HTML が無い"; exit 1; }
          echo "対象: $(echo "$DOCS" | wc -l) 文書"
          # 拾うのは要素の href・src の値だけ。文字列として grep すると、例の <pre> に書いた HTML
          # （1.1.0 の写しの <base href="https://shop.example/…">）までリンクとして叩いてしまう。
          REFS=$(python3 - $DOCS <<'PY'
          import sys
          from html.parser import HTMLParser

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in ("href", "src") and value and value.startswith(("http://", "https://")):
                          self.urls.add(value)

          urls = set()
          for path in sys.argv[1:]:
              parser = Links()
              parser.feed(open(path, encoding="utf-8").read())
              urls |= parser.urls
          print("\n".join(sorted(urls)))
          PY
          )
          for U in $REFS; do
            if echo "$U" | grep -qE "$SKIP"; then
              echo "  skip $U (toolchain が生成した定型リンク)"
              continue
            fi
            check "$U" || FAIL=1
          done
          exit $FAIL
